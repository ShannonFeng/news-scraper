  - name: Higher Ed Dive
    url: https://www.highereddive.com/feeds/news/
  - name: Campus Technology
    url: https://campustechnology.com/rss-feeds/news.aspx

criteria:
  coverage_areas:
    - business services
    - tech-enabled services
    - industrial technology
    - education
    - asset-light energy services
    - consumer
  excluded_areas:
    - financial technology
    - financial services
    - asset-heavy energy
    - asset-heavy industrial businesses
    - solar energy owner-operator
    - design-build construction
    - data center operator
    - pure-play manufacturers
    - DTC consumer brands
  location:
    - North America
    - European companies that primarily sell to US customers or have a US-based CEO
  ownership:
    - privately held
    - not a subsidiary of a parent company
    - may be venture, growth, or private equity backed
  positive_metrics:
    - greater than $10M ARR
    - if not ARR, greater than $10M EBITDA and profitable
    - greater than 30% year-over-year growth
    - large customer/operator/unit counts that imply scale
