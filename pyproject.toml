[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-scraper"
version = "0.1.0"
description = "Monitor news feeds and text PE-relevant private company leads."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "openai>=1.99.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "twilio>=9.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.6.4",
]

[project.scripts]
news-scraper = "news_scraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/news_scraper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
